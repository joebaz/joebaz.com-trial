name: Fix Issue
description: Report unintended site behavior or an uncovered design gap.
title: "[Fix]: "
labels:
  - fix
body:
  - type: markdown
    attributes:
      value: |
        Describe one focused or cohesive outcome. A fix may correct unintended behavior or address a gap in something that already exists.

        Do not include secrets, credentials, `.env` values, local paths, or private personal or customer information. Only provide personal information that is approved for public website publication.

  - type: dropdown
    id: reason
    attributes:
      label: Reason for change
      description: Choose the best match for this request.
      options:
        - Bug — existing behavior is not working as intended
        - Design gap — an unanticipated case should be supported
    validations:
      required: true

  - type: input
    id: affected_page_or_data
    attributes:
      label: Affected page or data
      description: Identify the affected page or shared site data. Include a public URL or the relevant public value when helpful.
    validations:
      required: true

  - type: textarea
    id: current_behavior
    attributes:
      label: Current behavior or limitation
      description: Describe what the visitor was trying to do, what happened, and who or what is affected. For a design gap, explain the unsupported case.
    validations:
      required: true

  - type: textarea
    id: success
    attributes:
      label: What does success look like?
      description: Describe the observable corrected behavior. You do not need to provide technical implementation details.
    validations:
      required: true

  - type: textarea
    id: website_facts_affected
    attributes:
      label: Website facts affected
      description: List changes to facts in `website-facts.yaml` at the repository root. Leave empty if none change.
    validations:
      required: false

  - type: textarea
    id: reproduction
    attributes:
      label: Steps or example
      description: If available, provide minimal reproduction steps or a concrete example. Note whether the issue is consistent or intermittent, and include browser, device, or assistive technology details only when relevant.
      value: |
        <!-- Add reproduction steps or a concrete example when available. -->
    validations:
      required: false

  - type: textarea
    id: supporting_files
    attributes:
      label: Supporting files
      description: Upload screenshots, recordings, or other files that help explain the problem. Before uploading, redact private personal or customer information unless it is approved for public website publication.
      value: |
        <!-- Attach supporting files here. -->
    validations:
      required: false

  - type: textarea
    id: unchanged
    attributes:
      label: What must stay the same?
      description: List any related behavior, layout, or content that should not change.
      value: |
        <!-- Add anything that must remain unchanged. -->
    validations:
      required: false
